<link rel="stylesheet" href="estilito/VentasEstilo.css"/>
<div class="modificar-venta-wrapper">
    <h2 class="section-title">Modificar Venta</h2>
    
    <div class="modificar-card">
        <span class="modificar-card-title">Ventas</span>
        
        <div class="modificar-list-container">
            <!-- Item de Venta Modificable (Puedes duplicar este bloque según necesites) -->
            <div class="venta-modificar-box">
                <!-- Columna Izquierda -->
                <div class="detalle-col-left">
                    <span class="detalle-text">No. Venta: 0000000</span>
                    <span class="detalle-text">Cliente:</span>
                    <span class="detalle-text">Caja/Turno:</span>
                    
                    <div class="productos-seccion">
                        <span class="detalle-text productos-label-title">Productos:</span>
                        <div class="productos-scroll-box"></div>
                    </div>
                </div>

                <div class="detalle-divider"></div>

                <!-- Columna Derecha -->
                <div class="detalle-col-right">
                    <span class="detalle-text">Fecha: 00/00/0000</span>
                    <span class="detalle-text">Subtotal:</span>
                    <span class="detalle-text">Impuestos:</span>
                    <span class="detalle-text">Total:</span>
                    <span class="detalle-text">Dinero recibido:</span>
                    <span class="detalle-text">Método de Pago:</span>
                    
                    <!-- Botón de edición en la esquina inferior derecha -->
                    <button class="btn-editar-icon" title="Modificar venta" onclick="HacerCambios()">
                        ✏️
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
