function cambiarCantidad(producto, cambio) {
        // Obtenemos el input correspondiente al producto usando su ID único
        const input = document.getElementById('cnt-' + producto);
        
        // Convertimos el valor actual a número (si está vacío, toma 0)
        let valorActual = parseInt(input.value) || 0;
        
        // Calculamos el nuevo valor sumando o restando
        let nuevoValor = valorActual + cambio;
        
        // Evitamos que baje de 0
        if (nuevoValor < 0) {
            nuevoValor = 0;
        }
        
        // Asignamos el nuevo valor al input
        input.value = nuevoValor;
    }
   
    // Variable global para saber qué elemento está seleccionado
    let filaSeleccionadaGlobal = null;

    function seleccionarVenta(elemento) {
        // Restaura el color original a todas las filas de la pantalla
        document.querySelectorAll('.venta-row-item').forEach(function(f) {
            f.style.backgroundColor = ""; 
            f.style.borderColor = "";
        });
        
        // Pinta la fila que se presionó con el color guinda/oscuro
        elemento.style.backgroundColor = "#5c1d29";
        elemento.style.borderColor = "#2b0b11";
        elemento.style.cursor = "pointer";
        
        // Guardamos la referencia para cuando presionen "Eliminar"
        filaSeleccionadaGlobal = elemento;
        
        console.log("¡Fila seleccionada correctamente mediante onclick directo!");
    }
