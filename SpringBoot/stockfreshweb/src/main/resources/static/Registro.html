<link rel="stylesheet" href="estilito/css.css"/>

<main class="principal">

    <div class="main-content">
        <h1>¡Únete a Stock & Fresh <br><span>y toma el control de tu negocio!</span></h1>
        <p>Administra tu inventario en tiempo real, registra las ventas de tu jornada laboral
           y lleva un control detallado de tu negocio.
           <strong>Ingresa tus datos como Locatario</strong></p>
    </div>

    <img src="naranja.png" alt="Naranja" class="fruta fruta-naranja">
    <img src="manzana.png" alt="Manzana" class="fruta fruta-manzana">
    <img src="pera_pro.png" alt="Pera" class="fruta fruta-pera-2">
    <img src="zanahoria_pro.png" alt="Zanahoria" class="fruta fruta-zanahoria">
    <img src="aguacatepro.png" alt="Aguacate" class="fruta fruta-aguacate">
    <img src="arandanos.png" alt="Arándanos" class="fruta fruta-arandanos">

    <div class="main-form-container">


        <form id="formPaso1">
            <label for="nombreLocatario">Nombre de Locatario</label>
            <input type="text" id="nombreLocatario" required>
            <br><br>
            <label for="correoLoc">Correo Electrónico</label>
            <input type="email" id="correoLoc" required>
            <br><br>
            <label for="numLoc">Número Telefónico</label>
            <input type="tel" id="numLoc" required>
            <br><br>
            <button type="submit" class="btn-enviar-sesion">Siguiente</button>
        </form>

        <form id="formPaso2" style="display:none">
            <label for="idLocatario">ID de Locatario</label>
            <input type="text" id="idLocatario" required>
            <br><br>
            <label for="password">Contraseña</label>
            <input type="password" id="password" required>
            <br><br>
            <button type="submit" class="btn-enviar-sesion">Registrarse</button>
        </form>

    </div>
</main>

<script src="registro.js"></script>
