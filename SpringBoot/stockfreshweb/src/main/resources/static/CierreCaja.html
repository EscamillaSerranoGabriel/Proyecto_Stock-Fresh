<link rel="stylesheet" href="estilito/CajaEstilo.css"/>
<div class="cierre-caja-wrapper">
    <h2 class="titulo-inventario">Cierre de Caja</h2>
    <img src="naranja.png" alt="Naranja" class="fruta fruta-naranja">
        <img src="manzana.png" alt="Manzana" class="fruta fruta-manzana">
        <img src="aguacatepro.png" alt="Aguacate" class="fruta fruta-aguacate">
        <img src="arandanos.png" alt="Arándanos" class="fruta fruta-arandanos">
    
    <div class="cierre-card">
        <!-- Columna Izquierda -->
        <div class="cierre-col-left">
            <div class="form-group">
                <label>Fondo Final</label>
                <input type="text" class="form-control" value="$ 0.00">
            </div>

            <div class="form-group">
                <label>No. Transacciones</label>
                <input type="text" class="form-control" value="00">
            </div>

            <div class="cierre-divider-horizontal"></div>

            <div class="form-group">
                <label>Total</label>
                <input type="text" class="form-control" value="$ 0.00">
            </div>
        </div>

        <div class="cierre-divider-vertical"></div>

        <!-- Columna Derecha -->
        <div class="cierre-col-right">
            <div class="cierre-row-selects">
                <div class="form-group half">
                    <label>Caja</label>
                    <select class="form-control select-control">
                        <option></option>
                    </select>
                </div>
                <div class="form-group half">
                    <label>Turno</label>
                    <select class="form-control select-control">
                        <option></option>
                    </select>
                </div>
            </div>

            <div class="pagos-seccion">
                <label class="pagos-titulo">Método de Pago</label>
                <div class="pagos-inputs-grid">
                    <div class="form-group">
                        <label class="sub-label">Efectivo</label>
                        <input type="text" class="form-control" value="000">
                    </div>
                    <div class="form-group">
                        <label class="sub-label">Tarjeta</label>
                        <input type="text" class="form-control" value="000">
                    </div>
                    <div class="form-group">
                        <label class="sub-label">Transferencia</label>
                        <input type="text" class="form-control" value="000">
                    </div>
                </div>
            </div>

            <button class="btn-cierre-accion">Cierre</button>
        </div>
    </div>
</div>
